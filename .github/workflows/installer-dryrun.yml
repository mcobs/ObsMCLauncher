name: Installer Dry Run

# 仅用于验证安装程序的打包结果：跑完只上传 artifact，不创建 release、不写 feed、不碰已有版本。
# 用途：改了 release.yml 里的 --msi / --inst* 参数后，先在这里跑一次，确认
#   ① MSI / pkg 真的产出了，文件名是什么（release.yml 里的重命名靠它定）
#   ② 向导页文案会不会溢出、GPLv3 能不能滚动
#   ③ macOS 在没签名的情况下能不能打出 pkg
on:
  workflow_dispatch:
    inputs:
      version:
        description: '用来打包的版本号（随便填，不会发布）'
        required: false
        default: '0.0.1-dryrun'

permissions:
  contents: read

jobs:
  dryrun:
    strategy:
      fail-fast: false   # 一个平台失败不影响看另一个平台的结果
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    env:
      Project_Path: ObsMCLauncher.Desktop/ObsMCLauncher.Desktop.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install Velopack CLI
      run: dotnet tool install -g vpk

    - name: Restore dependencies
      run: dotnet restore ${{ env.Project_Path }}

    # 与 release.yml 保持一致：先 build 再 publish，否则 Rebuild 时 XAML 编译可能被跳过
    - name: Build application
      run: dotnet build ${{ env.Project_Path }} -c Release --no-restore

    - name: Publish ${{ matrix.rid }}
      run: |
        dotnet publish ${{ env.Project_Path }} -c Release -r ${{ matrix.rid }} --self-contained true -p:DebugType=none -p:DebugSymbols=false -p:Version=${{ github.event.inputs.version }} -o ./publish/${{ matrix.rid }}

    - name: Pack with Velopack (installer dry run)
      shell: bash
      run: |
        rid="${{ matrix.rid }}"
        if [[ "$rid" == win-* ]]; then
          main_exe="ObsMCLauncher.Desktop.exe"
          icon_path="./ObsMCLauncher.Desktop/Assets/app_icon.ico"
        else
          main_exe="ObsMCLauncher.Desktop"
          icon_path="./ObsMCLauncher.Desktop/Assets/app_icon.icns"
        fi

        cp LICENSE ./installer-license.txt

        # --delta None：dry-run 不需要增量包，省得先下载上一版本
        pack_args=(-u ObsMCLauncher -v "${{ github.event.inputs.version }}" -p "./publish/$rid" -e "$main_exe" -o ./vpk-build --delta None -c "${rid}-dryrun" -r "$rid" -i "$icon_path")

        if [[ "$rid" == win-* ]]; then
          pack_args+=(--msi --instLocation PerUser
                      --instWelcome         ./.github/installer/welcome.txt
                      --instLicense         ./installer-license.txt
                      --instReadme          ./.github/installer/readme-win.txt
                      --instConclusion      ./.github/installer/conclusion-win.txt
                      --msiTopBanner        ./.github/installer/msi-top-banner.bmp
                      --msiDialogBackground ./.github/installer/msi-dialog-background.bmp)
        else
          pack_args+=(--instWelcome    ./.github/installer/welcome.txt
                      --instLicense    ./installer-license.txt
                      --instReadme     ./.github/installer/readme-mac.txt
                      --instConclusion ./.github/installer/conclusion-mac.txt)
        fi

        vpk pack "${pack_args[@]}"

    - name: Show produced files
      shell: bash
      run: |
        echo "=== vpk-build 产物（真实文件名以此为准）==="
        ls -la ./vpk-build/ || true
        echo ""
        echo "=== assets.*.json（vpk 认为这次构建包含哪些资产）==="
        cat ./vpk-build/assets.*.json || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dryrun-${{ matrix.rid }}
        path: ./vpk-build/
        retention-days: 7
