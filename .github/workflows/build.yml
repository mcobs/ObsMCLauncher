name: Build ObsMCLauncher

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[CI skip]') && !contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      # 一个平台失败不取消其余平台——CI 的价值就是同时拿到全部平台的结论
      fail-fast: false
      matrix:
        # 直接用 include 列出「平台 → RID」组合，省掉原来的 21 行 exclude
        include:
          - os: windows-latest
            rid: win-x86
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    env:
      Project_Path: ObsMCLauncher.Desktop/ObsMCLauncher.Desktop.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.Project_Path }}

    - name: Build application
      run: dotnet build ${{ env.Project_Path }} -c Release --no-restore

    - name: Get version info
      id: version
      shell: bash
      run: |
        # 不用 pipefail：下面的 sed|head 组合在 pipefail 下可能踩 SIGPIPE(141)
        set -eu

        # 版本号唯一真源：Directory.Build.props 的 <Version>，升版本只改那一处。
        # 用 sed 而不是 dotnet msbuild -getProperty：后者在三种 runner 上表现不一，
        # 且需要已 restore；sed 在 Linux / macOS(BSD sed) / Windows 上都能跑（BRE 语法）。
        base_version="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -n 1)"
        if [ -z "$base_version" ]; then
          echo "::error::无法确定版本号：请检查 Directory.Build.props 中的 <Version>"
          exit 1
        fi

        # 与 UI 实际显示的版本（VersionInfo.cs）比对，防止两处漂移
        ui_version="$(sed -n 's/.*string Version = "\(.*\)".*/\1/p' ObsMCLauncher.Core/Utils/VersionInfo.cs | head -n 1)"
        if [ -n "$ui_version" ] && [ "$ui_version" != "$base_version" ]; then
          echo "::error::版本号不一致：Directory.Build.props=${base_version}，VersionInfo.cs=${ui_version}"
          exit 1
        fi

        date="$(date +%Y%m%d)"
        short_sha="${GITHUB_SHA:0:7}"
        echo "version=v${base_version}-${date}-${short_sha}" >> $GITHUB_OUTPUT
        echo "version_number=${base_version}-${date}-${short_sha}" >> $GITHUB_OUTPUT
        echo "基础版本: ${base_version}（VersionInfo.cs: ${ui_version:-未找到}）"

    - name: Publish application
      run: |
        dotnet publish ${{ env.Project_Path }} -c Release -r ${{ matrix.rid }} --self-contained false -p:DebugType=none -p:DebugSymbols=false -p:Version=${{ steps.version.outputs.version_number }} -o ./publish/${{ matrix.rid }}

    - name: Set executable permission (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        if [ -f "./publish/${{ matrix.rid }}/ObsMCLauncher.Desktop" ]; then
          chmod +x "./publish/${{ matrix.rid }}/ObsMCLauncher.Desktop"
        fi

    - name: Verify output
      shell: bash
      run: |
        echo "发布目录内容:"
        ls -la "./publish/${{ matrix.rid }}/"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ObsMCLauncher-${{ steps.version.outputs.version }}-${{ matrix.rid }}
        path: ./publish/${{ matrix.rid }}/*
        retention-days: 90
